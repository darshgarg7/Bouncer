[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bouncer-constraint-projection"
version = "0.1.0"
description = "Deterministic constraint projection for Bouncer candidate actions"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "langgraph>=1.2,<2",
  "mypy>=1.14",
  "ruff>=0.9",
]

[tool.setuptools]
packages = ["benchmarking", "benchmarking.learning", "constraint_projection"]

[project.scripts]
bouncer-project = "constraint_projection.cli:main"
bouncer-fit-objectives = "benchmarking.objective_calibration:main"
bouncer-build-trajectories = "benchmarking.learning.observations:main"
bouncer-train-router = "benchmarking.learning.outcomes:main"
bouncer-fit-transitions = "benchmarking.learning.markov:main"
bouncer-fit-fqe = "benchmarking.learning.fitted_q:main"
bouncer-fit-anomaly = "benchmarking.learning.anomaly:main"
bouncer-evaluate-learning = "benchmarking.learning.evaluate:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
  "D105", # Magic methods inherit the class documentation.
  "D107", # Constructor details belong in the class documentation.
  "D203", # Use one blank line before class docstrings (PEP 257).
  "D213", # Put the summary on the first line of a multi-line docstring.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
