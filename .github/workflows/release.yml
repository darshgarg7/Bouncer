name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: make release-check
      - env:
          BOUNCER_VERSION: ${{ github.ref_name }}
        run: make release-artifacts
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/bouncer-${{ github.ref_name }}.spdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/*.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bouncer-${{ github.ref_name }}-qualification
          path: |
            dist/release/
            dist/test-reports/
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/release/*
          dist/test-reports/*
          --verify-tag
          --title "Bouncer ${{ github.ref_name }}"
          --notes-file docs/releases/v0.1.0.md

  containers:
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fbac11b74b5b5e1c3fb5938a4070b4bfd7 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve lowercase image names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower="${OWNER,,}"
          echo "bouncer=ghcr.io/${owner_lower}/bouncer" >> "$GITHUB_OUTPUT"
          echo "sandbox=ghcr.io/${owner_lower}/bouncer-sandbox" >> "$GITHUB_OUTPUT"
      - id: bouncer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.bouncer
          push: true
          tags: |
            ${{ steps.names.outputs.bouncer }}:${{ github.ref_name }}
            ${{ steps.names.outputs.bouncer }}:latest
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - name: Attest Bouncer image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.names.outputs.bouncer }}
          subject-digest: ${{ steps.bouncer.outputs.digest }}
          push-to-registry: true
      - id: sandbox
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: |
            ${{ steps.names.outputs.sandbox }}:${{ github.ref_name }}
            ${{ steps.names.outputs.sandbox }}:latest
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - name: Attest sandbox image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.names.outputs.sandbox }}
          subject-digest: ${{ steps.sandbox.outputs.digest }}
          push-to-registry: true
