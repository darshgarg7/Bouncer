name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * 3"

permissions:
  contents: read

jobs:
  critical-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: go install github.com/jonbaldie/go-mutesting/v2/cmd/go-mutesting@v2.7.9
      - env:
          MUTATION_TOOL: ${{ runner.temp }}/go-mutesting
          BOUNCER_POLICY_PARITY_CASES: "100"
        run: |
          cp "$(go env GOPATH)/bin/go-mutesting" "$MUTATION_TOOL"
          make mutation-check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-summary
          path: go-mutesting-summary.json
          if-no-files-found: warn
