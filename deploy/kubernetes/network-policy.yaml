apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bouncer-sandbox-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bouncer-sandbox
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bouncer-control-plane
      ports:
        - protocol: TCP
          port: 8082
  egress: []
